apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-echo
  labels:
    app.kubernetes.io/name: smoke-echo
    app.kubernetes.io/part-of: gitops-smoke
    platformone.io/owner: platform-engineering
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smoke-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-echo
        app.kubernetes.io/part-of: gitops-smoke
        platformone.io/owner: platform-engineering
    spec:
      containers:
        - name: echo
          image: traefik/whoami:v1.10.1
          ports:
            - containerPort: 80
